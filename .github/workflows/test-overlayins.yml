name: Test Overlay Install

on:
  push:
  workflow_dispatch:

jobs:
  overlay-install:
    name: Overlay install (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}

    permissions:
      contents: write

    strategy:
      matrix:
        runner:
          - ubuntu-latest
          - ubuntu-24.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y rsync

      - name: Run install_overlay.sh and save log
        run: |
          mkdir -p actions/test-overlayins.yml.log.d

          LOG="actions/test-overlayins.yml.log.d/$(date +'%Y-%m-%d_%H-%M-%S').log"

          echo "Running install_overlay.sh"
          echo "Log file: $LOG"

          chmod +x ./install_overlay.sh

          ./install_overlay.sh 2>&1 | tee "$LOG"

      - name: Configure GitHub Actions identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit logs and changes
        run: |
          git add actions/test-overlayins.yml.log.d

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Add overlay install test log ($(date +'%Y-%m-%d %H:%M:%S'))"

      - name: Push changes
        run: |
          git push origin HEAD:${GITHUB_REF_NAME}
