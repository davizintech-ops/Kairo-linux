name: Test Overlay Install

on:
  push:
  workflow_dispatch:

jobs:
  overlay-install:
    name: Overlay install (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}

    permissions:
      contents: write

    strategy:
      matrix:
        runner:
          - ubuntu-26.04
          - ubuntu-26.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install rsync
        run: |
          sudo apt update
          sudo apt install -y rsync

      - name: Run install_overlay.sh
        run: |
          mkdir -p actions/test-overlayins.yml.log.d

          case "$(uname -m)" in
            x86_64)
              ARCH="amd64"
              ;;
            aarch64|arm64)
              ARCH="arm64"
              ;;
            *)
              ARCH="$(uname -m)"
              ;;
          esac

          UBUNTU_VERSION="$(lsb_release -rs)"

          LOG="actions/test-overlayins.yml.log.d/$(date +'%Y-%m-%d_%H-%M-%S')-${ARCH}.log"

          echo "Testing on Ubuntu (${UBUNTU_VERSION}) (${ARCH})" | tee "${LOG}"
          echo "----------------------------------------" | tee -a "${LOG}"

          chmod +x ./install_overlay.sh

          sudo ./install_overlay.sh 2>&1 | tee -a "${LOG}"

      - name: Configure GitHub Actions identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit logs
        run: |
          git add actions/test-overlayins.yml.log.d

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Add overlay install test log"

      - name: Push commit
        run: |
          git push origin HEAD:${GITHUB_REF_NAME}
